<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Leonida Vault - GTA VI Edition</title>
  
  <!-- Manifest PWA -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Leonida Vault","short_name":"Vault","start_url":".","display":"standalone","background_color":"#0b0914","theme_color":"#ff007f","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2978/2978924.png","sizes":"512x512","type":"image/png"}]}'>
  
  <!-- Font GTA Style -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <!-- Ikon FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            'vice-dark': '#0b0914', 
            'neon-pink': '#ff007f', 
            'neon-cyan': '#00f0ff',
            'neon-orange': '#ff5e00',
            'neon-yellow': '#fcee0a'
          },
          fontFamily: { 
            sans: ['Outfit', 'sans-serif'],
            mono: ['Space Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    /* --- VICE CITY BACKGROUND --- */
    body {
      background-color: #0b0914;
      background-image: 
        /* Grid neon */
        linear-gradient(rgba(0, 240, 255, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.15) 1px, transparent 1px),
        /* Gradasi sunset di atas */
        radial-gradient(circle at 50% 0%, rgba(255, 0, 127, 0.4) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(255, 94, 0, 0.2) 0%, transparent 50%);
      background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
      background-position: center top;
      background-attachment: fixed;
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    /* Efek Kaca Gelap */
    .vice-glass {
      background: rgba(11, 9, 20, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Teks Neon */
    .text-glow-pink { text-shadow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.5); }
    .text-glow-cyan { text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.5); }
    .text-glow-orange { text-shadow: 0 0 10px rgba(255, 94, 0, 0.8), 0 0 20px rgba(255, 94, 0, 0.5); }
    .text-glow-yellow { text-shadow: 0 0 10px rgba(252, 238, 10, 0.8), 0 0 20px rgba(252, 238, 10, 0.5); }

    /* Garis Tepi Nyala */
    .border-glow-pink { box-shadow: 0 0 15px rgba(255, 0, 127, 0.3), inset 0 0 15px rgba(255, 0, 127, 0.1); border-color: rgba(255, 0, 127, 0.5); }
    .border-glow-cyan { box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.1); border-color: rgba(0, 240, 255, 0.5); }
    .border-glow-orange { box-shadow: 0 0 15px rgba(255, 94, 0, 0.3), inset 0 0 15px rgba(255, 94, 0, 0.1); border-color: rgba(255, 94, 0, 0.5); }

    /* Gaya Logo GTA VI */
    .gta-logo {
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      background: linear-gradient(to bottom, #fff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 4px 2px rgba(0, 240, 255, 0.5));
    }

    /* Sembunyikan Spinner */
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    /* Scrollbar Custom */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0914; }
    ::-webkit-scrollbar-thumb { background: #ff007f; border-radius: 10px; }
  </style>
</head>
<body class="antialiased pb-12">

  <div id="mainApp">
    <!-- NAVBAR -->
    <nav class="vice-glass sticky top-0 z-50 border-b border-neon-pink/50 shadow-[0_4px_30px_rgba(255,0,127,0.2)]">
      <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-md bg-gradient-to-br from-neon-pink to-neon-orange flex items-center justify-center text-white text-xl shadow-[0_0_15px_#ff007f]">
            <i class="fa-solid fa-vault"></i>
          </div>
          <div>
            <h1 class="gta-logo text-2xl uppercase">LEONIDA VAULT</h1>
            <p class="text-[10px] text-neon-cyan font-mono tracking-widest uppercase mt-0.5">Vice City Finance</p>
          </div>
        </div>
        <button onclick="openModal()" class="bg-neon-pink hover:bg-pink-600 text-white font-black py-2.5 px-5 rounded shadow-[0_0_20px_rgba(255,0,127,0.6)] transition-all transform hover:scale-105 active:scale-95 uppercase tracking-wider text-sm border border-pink-300">
          <i class="fa-solid fa-plus mr-1"></i> BARU
        </button>
      </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-6 relative z-10">
      
      <!-- KARTU RINGKASAN (BIG NUMBERS) -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
        
        <!-- DANA AWAL (CYAN) -->
        <div class="vice-glass p-6 rounded-xl border-l-4 border-glow-cyan relative overflow-hidden">
          <div class="absolute -right-4 -top-4 text-7xl text-cyan-500/10"><i class="fa-solid fa-wallet"></i></div>
          <p class="text-xs text-neon-cyan font-bold uppercase tracking-widest mb-2 font-mono">Dana Awal</p>
          <p id="danaAwalText" class="text-4xl font-black text-white font-mono text-glow-cyan">Rp 0</p>
          <button onclick="editDanaAwal()" class="mt-4 text-[11px] text-neon-cyan bg-neon-cyan/10 border border-neon-cyan/50 px-3 py-1.5 rounded uppercase font-bold tracking-wider hover:bg-neon-cyan hover:text-black transition-colors">
            <i class="fa-solid fa-pen-to-square mr-1"></i> Edit Modal
          </button>
        </div>

        <!-- PENGELUARAN (PINK) -->
        <div class="vice-glass p-6 rounded-xl border-l-4 border-glow-pink relative overflow-hidden">
          <div class="absolute -right-4 -top-4 text-7xl text-pink-500/10"><i class="fa-solid fa-money-bill-transfer"></i></div>
          <p class="text-xs text-neon-pink font-bold uppercase tracking-widest mb-2 font-mono">Total Keluar</p>
          <p id="totalKeluar" class="text-4xl font-black text-neon-pink font-mono text-glow-pink">Rp 0</p>
        </div>

        <!-- SISA SALDO (ORANGE) -->
        <div class="vice-glass p-6 rounded-xl border-l-4 border-glow-orange relative overflow-hidden bg-gradient-to-br from-vice-dark to-orange-900/20">
          <div class="absolute -right-4 -top-4 text-7xl text-orange-500/10"><i class="fa-solid fa-chart-line"></i></div>
          <p class="text-xs text-neon-orange font-bold uppercase tracking-widest mb-2 font-mono">Sisa Saldo</p>
          <p id="sisaSaldo" class="text-4xl font-black text-white font-mono text-glow-orange">Rp 0</p>
        </div>
      </div>

      <!-- TEMUAN AUDIT (Gaya Police Tape / Hacker Terminal) -->
      <div class="vice-glass border border-neon-yellow/60 p-5 rounded-xl relative overflow-hidden shadow-[0_0_20px_rgba(252,238,10,0.15)] bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,rgba(252,238,10,0.05)_10px,rgba(252,238,10,0.05)_20px)]">
        <div class="absolute top-0 left-0 w-1.5 h-full bg-neon-yellow"></div>
        <div class="flex items-start gap-4">
          <div class="text-3xl text-neon-yellow animate-pulse drop-shadow-[0_0_10px_rgba(252,238,10,0.8)]"><i class="fa-solid fa-triangle-exclamation"></i></div>
          <div>
            <h3 class="font-black text-neon-yellow uppercase tracking-widest text-sm font-mono">[!] INTEL: UANG RP 60.000 MASIH UTUH</h3>
            <p class="text-sm text-gray-300 mt-1 font-mono leading-relaxed">
              Baris ke-27 &rarr; 28 melompat ke 4735. Seharusnya 4615 + 60 = 4675.<br> Sisa saldo riil: <strong class="text-white text-glow-yellow">Rp 7.600.000</strong>.
            </p>
          </div>
        </div>
      </div>

      <!-- TABEL RIWAYAT -->
      <div class="vice-glass rounded-xl overflow-hidden shadow-2xl border border-white/10">
        <div class="p-5 border-b border-white/10 bg-black/40 flex flex-col sm:flex-row justify-between items-center gap-4">
          <h2 class="font-black text-xl tracking-wider text-white uppercase font-mono"><i class="fa-solid fa-terminal text-neon-cyan mr-2"></i> SYSTEM LOG</h2>
          <div class="relative w-full sm:w-72">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
            <input type="text" id="searchInput" oninput="renderTable()" placeholder="Cari transaksi..." class="w-full pl-10 pr-4 py-3 bg-black/60 border border-white/20 rounded-md text-sm text-white font-mono focus:outline-none focus:border-neon-cyan focus:shadow-[0_0_10px_rgba(0,240,255,0.3)] transition-all">
          </div>
        </div>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm font-mono">
            <thead class="bg-black/60 text-gray-400 border-b border-white/10">
              <tr>
                <th class="py-4 px-5 font-bold uppercase tracking-wider">ID</th>
                <th class="py-4 px-5 font-bold uppercase tracking-wider">Keterangan</th>
                <th class="py-4 px-5 font-bold uppercase tracking-wider text-right">Nominal</th>
                <th class="py-4 px-5 font-bold uppercase tracking-wider text-center">Opsi</th>
              </tr>
            </thead>
            <tbody id="tabelBody" class="divide-y divide-white/5"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL TAMBAH DATA -->
  <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="vice-glass rounded-xl shadow-[0_0_30px_rgba(255,0,127,0.3)] w-full max-w-sm overflow-hidden border border-neon-pink">
      <div class="bg-gradient-to-r from-neon-pink to-neon-orange p-4 flex justify-between items-center text-white">
        <h3 class="font-black tracking-widest uppercase font-mono"><i class="fa-solid fa-plus-circle mr-2"></i> NEW ENTRY</h3>
        <button onclick="closeModal()" class="text-2xl hover:text-black transition-colors">&times;</button>
      </div>
      <form id="formTambah" class="p-6 space-y-5" onsubmit="tambahData(event)">
        <div>
          <label class="block text-[11px] font-bold text-neon-cyan mb-2 uppercase tracking-widest font-mono">Keterangan</label>
          <input type="text" id="inputNama" required class="w-full px-4 py-3 bg-black/50 border border-white/20 rounded text-white font-mono focus:outline-none focus:border-neon-cyan focus:shadow-[0_0_10px_rgba(0,240,255,0.2)]" placeholder="Cth: Beli Amunisi">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-neon-cyan mb-2 uppercase tracking-widest font-mono">Nominal ($ / Rp)</label>
          <input type="number" id="inputNominal" required class="w-full px-4 py-3 bg-black/50 border border-white/20 rounded text-white font-mono focus:outline-none focus:border-neon-cyan focus:shadow-[0_0_10px_rgba(0,240,255,0.2)]" placeholder="Cth: 50000">
        </div>
        <button type="submit" class="w-full bg-neon-cyan text-black font-black py-3.5 rounded hover:bg-cyan-300 transition-colors uppercase tracking-widest font-mono shadow-[0_0_15px_rgba(0,240,255,0.4)]">EXECUTE</button>
      </form>
    </div>
  </div>

  <!-- MODAL EDIT DATA -->
  <div id="editModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="vice-glass rounded-xl shadow-[0_0_30px_rgba(0,240,255,0.3)] w-full max-w-sm overflow-hidden border border-neon-cyan">
      <div class="bg-gradient-to-r from-neon-cyan to-blue-600 p-4 flex justify-between items-center text-black">
        <h3 class="font-black tracking-widest uppercase font-mono"><i class="fa-solid fa-pen-to-square mr-2"></i> EDIT DATA</h3>
        <button onclick="closeEditModal()" class="text-2xl hover:text-white transition-colors">&times;</button>
      </div>
      <div class="p-6 space-y-5">
        <input type="hidden" id="editIndex">
        <div>
          <label class="block text-[11px] font-bold text-neon-cyan mb-2 uppercase tracking-widest font-mono">Keterangan</label>
          <input type="text" id="editNama" class="w-full px-4 py-3 bg-black/50 border border-white/20 rounded text-white font-mono focus:outline-none focus:border-neon-cyan">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-neon-cyan mb-2 uppercase tracking-widest font-mono">Nominal ($ / Rp)</label>
          <input type="number" id="editNominal" class="w-full px-4 py-3 bg-black/50 border border-white/20 rounded text-white font-mono focus:outline-none focus:border-neon-cyan">
        </div>
        <button onclick="simpanEditData()" class="w-full bg-neon-cyan text-black font-black py-3.5 rounded hover:bg-cyan-300 transition-colors uppercase tracking-widest font-mono shadow-[0_0_15px_rgba(0,240,255,0.4)]">UPDATE SYSTEM</button>
      </div>
    </div>
  </div>

  <script>
    const dataAwal = [
      { nama: "Belanja masak mamak", nominal: 100000 }, { nama: "Sedekah", nominal: 500000 },
      { nama: "Pegangan mamak", nominal: 500000 }, { nama: "Bensin", nominal: 25000 },
      { nama: "Bor air", nominal: 1200000 }, { nama: "Bagus", nominal: 500000 },
      { nama: "Belanja telur / mie instan", nominal: 53000 }, { nama: "Ceret minum", nominal: 15000 },
      { nama: "Paralon / sambungan", nominal: 131000 }, { nama: "Celana 3x / kaos 2x", nominal: 150000 },
      { nama: "Usb voltmeter", nominal: 18000 }, { nama: "Hp anissa", nominal: 600000 },
      { nama: "Galon 1x", nominal: 6000 }, { nama: "Bayar hutang makyah gas", nominal: 100000 },
      { nama: "Masak janganan patin+pitek", nominal: 50000 }, { nama: "Pertalite", nominal: 20000 },
      { nama: "Sabun+odol", nominal: 10000 }, { nama: "Jajan nisa", nominal: 14000 },
      { nama: "Baju nisa", nominal: 52000 }, { nama: "TEGAR", nominal: 100000 },
      { nama: "Galon", nominal: 6000 }, { nama: "Mbak ria", nominal: 100000 },
      { nama: "Mak ini", nominal: 100000 }, { nama: "Mamak", nominal: 100000 },
      { nama: "Pertalite, case hp oppo12", nominal: 40000 }, { nama: "Charger hp", nominal: 75000 },
      { nama: "Sendal", nominal: 50000 }, { nama: "Bayar iuran (Audit +60rb)", nominal: 60000 },
      { nama: "Mamak", nominal: 50000 }, { nama: "Cukur+ silet", nominal: 25000 },
      { nama: "Blonjo", nominal: 75000 }, { nama: "Mamak", nominal: 15000 },
      { nama: "Minyak+obat", nominal: 80000 }, { nama: "Sprite +galon+endok", nominal: 30000 },
      { nama: "Mamak", nominal: 100000 }, { nama: "Minyak+jajan", nominal: 25000 },
      { nama: "Blonjo alat motor", nominal: 125000 }, { nama: "Mamak blonjo", nominal: 100000 },
      { nama: "Brobat nisa", nominal: 100000 }
    ];

    let dataPengeluaran = JSON.parse(localStorage.getItem('kimetsu_data')) || dataAwal;
    let danaAwal = parseInt(localStorage.getItem('kimetsu_dana_awal')) || 13000000;

    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

    function renderTable() {
      const tbody = document.getElementById('tabelBody');
      const search = document.getElementById('searchInput').value.toLowerCase();
      tbody.innerHTML = '';
      
      const filteredData = dataPengeluaran.filter(item => item.nama.toLowerCase().includes(search));

      filteredData.forEach((item, index) => {
        const originalIndex = dataPengeluaran.indexOf(item);
        const tr = document.createElement('tr');
        tr.className = "hover:bg-white/5 transition-colors border-b border-white/5";
        tr.innerHTML = `
          <td class="py-4 px-5 text-neon-cyan font-bold">#${String(index + 1).padStart(2, '0')}</td>
          <td class="py-4 px-5 font-bold text-white text-base">${item.nama}</td>
          <td class="py-4 px-5 text-right font-black text-neon-pink text-base text-glow-pink">${formatRp(item.nominal)}</td>
          <td class="py-4 px-5 text-center whitespace-nowrap">
            <button onclick="bukaEditModal(${originalIndex})" class="text-neon-cyan bg-neon-cyan/10 border border-neon-cyan/50 py-2 px-3 rounded mr-1 hover:bg-neon-cyan hover:text-black hover:shadow-[0_0_10px_rgba(0,240,255,0.5)] transition-all"><i class="fa-solid fa-pen"></i></button>
            <button onclick="hapusData(${originalIndex})" class="text-neon-pink bg-neon-pink/10 border border-neon-pink/50 py-2 px-3 rounded hover:bg-neon-pink hover:text-white hover:shadow-[0_0_10px_rgba(255,0,127,0.5)] transition-all"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      const totalKeluar = dataPengeluaran.reduce((sum, i) => sum + i.nominal, 0);
      document.getElementById('danaAwalText').innerText = formatRp(danaAwal);
      document.getElementById('totalKeluar').innerText = formatRp(totalKeluar);
      document.getElementById('sisaSaldo').innerText = formatRp(danaAwal - totalKeluar);
    }

    function editDanaAwal() {
      const input = prompt("Masukkan Total Dana Awal (Hanya Angka):", danaAwal);
      if (input !== null) {
        const angkaBaru = parseInt(input);
        if (!isNaN(angkaBaru) && angkaBaru >= 0) {
          danaAwal = angkaBaru;
          localStorage.setItem('kimetsu_dana_awal', danaAwal);
          renderTable();
        } else {
          alert("Masukkan angka yang valid!");
        }
      }
    }

    function bukaEditModal(index) {
      const item = dataPengeluaran[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('editNama').value = item.nama;
      document.getElementById('editNominal').value = item.nominal;
      
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').classList.add('flex');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').classList.remove('flex');
    }

    function simpanEditData() {
      const index = document.getElementById('editIndex').value;
      const namaBaru = document.getElementById('editNama').value.trim();
      const nominalBaru = parseInt(document.getElementById('editNominal').value);
      
      if (namaBaru && !isNaN(nominalBaru) && nominalBaru > 0) {
        dataPengeluaran[index] = { nama: namaBaru, nominal: nominalBaru };
        localStorage.setItem('kimetsu_data', JSON.stringify(dataPengeluaran));
        closeEditModal();
        renderTable();
      } else {
        alert("Pastikan nama terisi dan nominal berupa angka yang valid.");
      }
    }

    function tambahData(e) {
      e.preventDefault();
      const nama = document.getElementById('inputNama').value;
      const nominal = parseInt(document.getElementById('inputNominal').value);
      if(nama && nominal) {
        dataPengeluaran.unshift({ nama, nominal });
        localStorage.setItem('kimetsu_data', JSON.stringify(dataPengeluaran));
        closeModal(); renderTable(); document.getElementById('formTambah').reset();
      }
    }

    function hapusData(index) {
      if(confirm('Hapus data ini dari sistem?')) {
        dataPengeluaran.splice(index, 1);
        localStorage.setItem('kimetsu_data', JSON.stringify(dataPengeluaran));
        renderTable();
      }
    }

    function openModal() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }
    
    window.onload = renderTable;
  </script>
</body>
</html>
